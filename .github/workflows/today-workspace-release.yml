name: Today Workspace Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Android versionName
        required: true
        default: "0.3.0"
        type: string
      version_code:
        description: Android versionCode (must always increase)
        required: true
        default: "3"
        type: string
  pull_request:
    paths:
      - ".github/workflows/today-workspace-release.yml"
      - "scripts/configure-android-release.mjs"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"

permissions:
  contents: read

jobs:
  release-smoke-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: "0.3.0"
      VERSION_CODE: "3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync web bundle
        run: npx cap sync android

      - name: Verify Google Play target SDK
        run: |
          grep -Eq 'targetSdkVersion\s*=\s*36|targetSdk\s+36|targetSdk\s*=\s*36' android/variables.gradle android/app/build.gradle

      - name: Configure Android release metadata
        run: node scripts/configure-android-release.mjs

      - name: Create ephemeral CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -storetype JKS \
            -storepass ci-release-only \
            -alias ci-release \
            -keypass ci-release-only \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30 \
            -dname "CN=Today Workspace CI, OU=CI, O=Today Workspace, C=US"
          cat > android/keystore.properties <<'EOF'
          storeFile=release.keystore
          storePassword=ci-release-only
          keyAlias=ci-release
          keyPassword=ci-release-only
          EOF

      - name: Build release variants
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew clean assembleRelease bundleRelease --no-daemon

      - name: Verify smoke-test signatures
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

  build-signed-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync web bundle
        run: npx cap sync android

      - name: Verify Google Play target SDK
        run: |
          grep -Eq 'targetSdkVersion\s*=\s*36|targetSdk\s+36|targetSdk\s*=\s*36' android/variables.gradle android/app/build.gradle

      - name: Configure Android release metadata
        run: node scripts/configure-android-release.mjs

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          node <<'NODE'
          const fs = require('node:fs');
          const escapeProperty = value => String(value)
            .replace(/\\/g, '\\\\')
            .replace(/([:=#!])/g, '\\$1');
          const lines = [
            'storeFile=release.keystore',
            `storePassword=${escapeProperty(process.env.KEYSTORE_PASSWORD)}`,
            `keyAlias=${escapeProperty(process.env.KEY_ALIAS)}`,
            `keyPassword=${escapeProperty(process.env.KEY_PASSWORD)}`,
            ''
          ];
          fs.writeFileSync('android/keystore.properties', lines.join('\n'));
          NODE

      - name: Build signed Release APK and AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew clean assembleRelease bundleRelease --no-daemon

      - name: Verify release signatures
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Stage release artifacts
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/release/app-release.apk "release-output/Today-Workspace-${VERSION_NAME}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release-output/Today-Workspace-${VERSION_NAME}.aab"
          sha256sum release-output/* > release-output/SHA256SUMS.txt

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: today-workspace-${{ inputs.version_name }}-release
          path: release-output/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release $TAG already exists. Increase version_name before publishing again."
            exit 1
          fi
          gh release create "$TAG" release-output/* \
            --target "$GITHUB_SHA" \
            --title "Today Workspace ${TAG}" \
            --generate-notes
